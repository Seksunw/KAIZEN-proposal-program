<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAIZEN Proposal Program</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20260911z55" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div class="shell">
    <aside id="sidebar" hidden>
      <div class="sidebar-brand">
        <img src="assets/suntory-wellness.jpg" alt="Suntory Wellness" />
        <span class="brand-sub">KAIZEN PROGRAM</span>
      </div>
      <nav id="sidebar-nav"></nav>
      <div id="sidebar-user"></div>
    </aside>
    <div class="shell-main">
      <main id="app"></main>
    </div>
  </div>

  <!-- Mobile-only chrome (≤760px) — ดู CLAUDE.md/Spec.md เรื่อง mobile nav redesign
       (2026-09-10) แสดง/ซ่อนคู่กับ #sidebar ใน renderChrome() (js/app.js) เลย์เอาต์และ
       animation ทั้งหมดอยู่ใน css/style.css เฉพาะภายใน @media (max-width:760px) -->
  <nav id="mobile-tabbar" hidden></nav>

  <div id="mobile-drawer-backdrop" hidden></div>
  <aside id="mobile-drawer" hidden aria-hidden="true">
    <div class="mobile-drawer-handle" aria-hidden="true"></div>
    <div class="mobile-drawer-head">
      <span class="eyebrow"></span>
      <button type="button" id="btn-drawer-close" class="icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="mobile-drawer-user"></div>
    <nav id="mobile-drawer-nav"></nav>
  </aside>

  <script type="module" src="js/app.js?v=20260911t"></script>
</body>
</html>
